<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微型鬼抓人：黑白太極命運抉擇版</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #121212; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            text-align: center; background: #1e1e1e;
            padding: 12px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            position: relative;
        }

        #hud {
            display: flex; flex-direction: column; gap: 4px;
            margin-bottom: 8px; font-size: 0.9rem;
            background: #2d2d2d; padding: 8px 15px;
            border-radius: 8px; border: 1px solid #3d3d3d;
            width: 380px; box-sizing: border-box; margin: 0 auto 8px auto;
        }

        .hud-row { display: flex; justify-content: space-between; align-items: center; }
        .status-highlight { font-weight: bold; }

        #game-canvas {
            background-color: #000000; border: 3px solid #333;
            border-radius: 6px; display: block; margin: 0 auto;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
            max-width: 90vw; max-height: 90vw;
        }

        /* 介面覆蓋層 */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; backdrop-filter: blur(6px); padding: 20px; box-sizing: border-box;
        }

        .overlay h2 { font-size: 1.6rem; margin-bottom: 12px; text-align: center; }
        .overlay p { font-size: 0.95rem; margin-bottom: 20px; max-width: 300px; text-align: center; line-height: 1.5; color: #ccc; }

        .btn {
            background: #ff4757; color: white; border: none;
            padding: 10px 24px; font-size: 0.95rem; font-weight: bold;
            border-radius: 6px; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); margin: 5px;
        }
        .btn:hover { background: #ff6b81; transform: scale(1.03); }
        
        /* HUD 功能小按鈕 */
        .btn-group { display: flex; gap: 4px; }
        .btn-hud-small { border: none; color: white; padding: 4px 6px; font-size: 0.75rem; font-weight: bold; border-radius: 4px; cursor: pointer; }
        #hud-skip-btn { background: #1e90ff; }
        #hud-skip-btn:hover { background: #70a1ff; }
        #hud-restart-btn { background: #ffa502; }
        #hud-restart-btn:hover { background: #ffb142; }
        #hud-change-role-btn { background: #5352ed; }
        #hud-change-role-btn:hover { background: #706fd3; }

        .hidden { display: none !important; }

        input[type="text"] {
            background: #2d2d2d; border: 2px solid #444; color: white;
            padding: 10px; border-radius: 6px; font-size: 1rem;
            text-align: center; margin-bottom: 15px; width: 200px; outline: none;
        }
        input[type="text"]:focus { border-color: #1e90ff; }

        /* 命運轉盤 */
        #wheel-container { position: relative; width: 200px; height: 200px; margin-bottom: 20px; }
        #wheel-canvas { border-radius: 50%; border: 4px solid #fff; transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
        #wheel-pointer {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 12px solid transparent;
            border-right: 12px solid transparent; border-top: 20px solid #ff4757; z-index: 12;
        }

        /* 排行榜 */
        .leaderboard-table { width: 260px; margin: 10px auto; border-collapse: collapse; font-size: 0.9rem; }
        .leaderboard-table th, .leaderboard-table td { padding: 6px; border-bottom: 1px solid #333; text-align: center; }
        .leaderboard-table th { color: #eccc68; }

        /* 行動裝置虛擬搖桿 */
        #joystick-zone {
            position: fixed; bottom: 30px; left: 30px;
            width: 100px; height: 100px; background: rgba(255,255,255,0.06);
            border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
            display: none; touch-action: none; z-index: 5;
        }
        #joystick-stick {
            position: absolute; top: 35px; left: 35px;
            width: 30px; height: 30px; background: rgba(30, 144, 255, 0.6);
            border-radius: 50%; box-shadow: 0 0 10px rgba(30,144,255,0.5);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            <div class="hud-row">
                <div>玩家: <span id="hud-name" style="color: #1e90ff;">未命名</span></div>
                <div>關卡: <span id="level-val" style="color: #eccc68;">1</span>/20</div>
            </div>
            <div class="hud-row">
                <div>身分: <span id="role-val" class="status-highlight">-</span></div>
                <div><span id="time-val" style="color: #ffa502;">0</span></div>
            </div>
            <div class="hud-row" style="margin-top: 4px;">
                <div>狀態: <span id="respawn-hint" style="color: #2ed573;">準備中</span></div>
                <div class="btn-group">
                    <button class="btn-hud-small" id="hud-skip-btn">⏩ 跳關</button>
                    <button class="btn-hud-small" id="hud-restart-btn">🔄 重開</button>
                    <button class="btn-hud-small" id="hud-change-role-btn">🎭 換陣營</button>
                </div>
            </div>
        </div>

        <canvas id="game-canvas" width="400" height="400"></canvas>
    </div>

    <div id="joystick-zone"><div id="joystick-stick"></div></div>

    <div id="name-overlay" class="overlay">
        <h2>🏆 宿命戰役：登入戰場</h2>
        <p>請輸入您的戰士名稱以加入排行榜：</p>
        <input type="text" id="player-name-input" placeholder="輸入名字..." maxlength="8" value="玩家A">
        <button id="submit-name-btn" class="btn">確認名稱</button>
        
        <h3 style="margin-top: 15px; color: #eccc68; font-size: 1.1rem;">📊 本地歷史前五名</h3>
        <table class="leaderboard-table" id="leaderboard-init">
            <thead><tr><th>名次</th><th>玩家</th><th>關卡</th><th>總分</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="wheel-overlay" class="overlay hidden">
        <h2>🎡 抽取你的命運陣營</h2>
        <p>黑白太極，人鬼各半。這一次，你要扮演誰？</p>
        <div id="wheel-container">
            <div id="wheel-pointer"></div>
            <canvas id="wheel-canvas" width="200" height="200"></canvas>
        </div>
        <button id="spin-btn" class="btn">命運開轉！</button>
    </div>

    <div id="msg-overlay" class="overlay hidden">
        <h2 id="msg-title">標題</h2>
        <p id="msg-desc">敘述</p>
        <div id="leaderboard-box" class="hidden">
            <h3 style="color: #eccc68;">📊 最新排行榜</h3>
            <table class="leaderboard-table" id="leaderboard-end">
                <thead><tr><th>名次</th><th>玩家</th><th>關卡</th><th>總分</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <button id="msg-next-btn" class="btn">前進下一階段</button>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // UI 元素
        const hudName = document.getElementById('hud-name');
        const levelVal = document.getElementById('level-val');
        const roleVal = document.getElementById('role-val');
        const timeVal = document.getElementById('time-val');
        const respawnHint = document.getElementById('respawn-hint');
        const hudSkipBtn = document.getElementById('hud-skip-btn');
        const hudRestartBtn = document.getElementById('hud-restart-btn');
        const hudChangeRoleBtn = document.getElementById('hud-change-role-btn');

        const nameOverlay = document.getElementById('name-overlay');
        const playerNameInput = document.getElementById('player-name-input');
        const submitNameBtn = document.getElementById('submit-name-btn');

        const wheelOverlay = document.getElementById('wheel-overlay');
        const wheelCanvas = document.getElementById('wheel-canvas');
        const spinBtn = document.getElementById('spin-btn');

        const msgOverlay = document.getElementById('msg-overlay');
        const msgTitle = document.getElementById('msg-title');
        const msgDesc = document.getElementById('msg-desc');
        const msgNextBtn = document.getElementById('msg-next-btn');
        const leaderboardBox = document.getElementById('leaderboard-box');

        // 核心變數
        let playerName = "玩家A";
        let currentLevel = 1;
        const maxLevels = 20;
        let totalScoreRaw = 0;
        let totalDeaths = 0;
        let levelTimeElapsed = 0;
        let timeLeft = 30;
        let gameActive = false;
        let playerRole = '未定'; 
        let gameTimer = null;

        const player = { x: 200, y: 200, radius: 6, speed: 3, color: '#1e90ff' };
        let touchControls = { active: false, vx: 0, vy: 0 };

        // 地圖障礙物
        const obstacles = [
            { type: 'rect', x: 40, y: 40, width: 15, height: 15, cX: 47.5, cY: 47.5 },
            { type: 'rect', x: 120, y: 30, width: 10, height: 30, cX: 125, cY: 45 },
            { type: 'circle', x: 80, y: 110, radius: 10, cX: 80, cY: 110 },
            { type: 'circle', x: 160, y: 70, radius: 8, cX: 160, cY: 70 },
            { type: 'rect', x: 50, y: 160, width: 25, height: 10, cX: 62.5, cY: 165 },
            { type: 'rect', x: 240, y: 50, width: 30, height: 10, cX: 255, cY: 55 },
            { type: 'circle', x: 320, y: 40, radius: 12, cX: 320, cY: 40 },
            { type: 'rect', x: 280, y: 120, width: 15, height: 15, cX: 287.5, cY: 127.5 },
            { type: 'circle', x: 350, y: 150, radius: 9, cX: 350, cY: 150 },
            { type: 'rect', x: 30, y: 240, width: 12, height: 25, cX: 36, cY: 252.5 },
            { type: 'circle', x: 70, y: 320, radius: 11, cX: 70, cY: 320 },
            { type: 'rect', x: 130, y: 260, width: 20, height: 20, cX: 140, cY: 270 },
            { type: 'circle', x: 150, y: 340, radius: 8, cX: 150, cY: 340 },
            { type: 'rect', x: 60, y: 370, width: 40, height: 8, cX: 80, cY: 374 },
            { type: 'rect', x: 250, y: 250, width: 16, height: 16, cX: 258, cY: 258 },
            { type: 'circle', x: 340, y: 230, radius: 10, cX: 340, cY: 230 },
            { type: 'rect', x: 220, y: 320, width: 12, height: 35, cX: 226, cY: 337.5 },
            { type: 'circle', x: 310, y: 330, radius: 12, cX: 310, cY: 330 },
            { type: 'rect', x: 360, y: 310, width: 20, height: 12, cX: 370, cY: 316 }
        ];

        let npcs = [];
        const keys = {};

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isTouchDevice) {
            document.getElementById('joystick-zone').style.display = 'block';
            initJoystick();
        }

        renderLeaderboard('leaderboard-init');

        // 🌟 核心新增：跳關扣分機制
        function triggerSkipLevel() {
            if (!gameActive) return;
            if (currentLevel >= maxLevels) {
                alert("已達最終關卡，無法再使用跳關功能！");
                return;
            }

            let confirmSkip = confirm(`確定要跳過第 ${currentLevel} 關嗎？\n代價：總分將會依比例倒扣 35%！`);
            if (confirmSkip) {
                gameActive = false;
                clearInterval(gameTimer);
                
                // 扣除目前總分的 35%
                let oldScore = Math.round(totalScoreRaw);
                totalScoreRaw = totalScoreRaw * 0.65;
                let newScore = Math.round(totalScoreRaw);

                currentLevel++; // 推進關卡
                
                msgOverlay.classList.remove('hidden');
                leaderboardBox.classList.add('hidden');
                msgTitle.innerText = `⏩ 已成功跳過關卡！`;
                msgDesc.innerHTML = `你選擇避開了戰火，總分從 <strong>${oldScore}</strong> 扣減至 <strong style='color:#ff4757;'>${newScore}</strong> 分。<br>即將面臨第 <strong>${currentLevel}</strong> 關更嚴峻的挑戰！`;
                msgNextBtn.innerText = "前進下一關";
            }
        }
        hudSkipBtn.addEventListener('click', triggerSkipLevel);

        function triggerSameSetupRestart() {
            clearInterval(gameTimer);
            gameActive = false; currentLevel = 1; totalScoreRaw = 0; totalDeaths = 0;
            msgOverlay.classList.add('hidden'); wheelOverlay.classList.add('hidden');
            startLevel();
        }
        hudRestartBtn.addEventListener('click', triggerSameSetupRestart);

        function triggerChangeRoleDirectly() {
            let confirmChange = confirm("此前遊玩成績會徹底作廢，是否確定更改？");
            if (confirmChange) {
                clearInterval(gameTimer); gameActive = false;
                currentLevel = 1; totalScoreRaw = 0; totalDeaths = 0; npcs = [];
                playerRole = (playerRole === '人') ? '鬼' : '人';
                
                wheelOverlay.classList.add('hidden'); nameOverlay.classList.add('hidden');
                msgOverlay.classList.remove('hidden'); leaderboardBox.classList.add('hidden');
                
                msgTitle.innerText = `🎭 陣營直接轉換：【${playerRole === '人' ? '人類' : '惡鬼'}】`;
                msgDesc.innerText = playerRole === '人' ? 
                    "已直接切換為凡人！藉由碎石掩體求生 30 秒，成績已重置。" :
                    "已直接切換為厲鬼！NPC人類啟動360度極座標路徑演算，會瘋狂利用掩體死角卡你視野！";
                msgNextBtn.innerText = "直接進入第一關";
            }
        }
        hudChangeRoleBtn.addEventListener('click', triggerChangeRoleDirectly);

        submitNameBtn.addEventListener('click', () => {
            let nameInput = playerNameInput.value.trim();
            playerName = nameInput ? nameInput : "無名戰士";
            hudName.innerText = playerName;
            nameOverlay.classList.add('hidden'); wheelOverlay.classList.remove('hidden');
            drawWheel(0);
        });

        function drawWheel(angle) {
            const wctx = wheelCanvas.getContext('2d');
            wctx.clearRect(0,0,200,200); wctx.save(); wctx.translate(100,100); wctx.rotate(angle);
            const colors = ['#2ed573', '#ff4757', '#2ed573', '#ff4757'];
            const labels = ['人類', '惡鬼', '人類', '惡鬼'];
            for(let i=0; i<4; i++){
                wctx.beginPath(); wctx.moveTo(0,0); wctx.arc(0,0, 96, i*Math.PI/2, (i+1)*Math.PI/2);
                wctx.fillStyle = colors[i]; wctx.fill();
                wctx.save(); wctx.rotate(i*Math.PI/2 + Math.PI/4);
                wctx.fillStyle = '#fff'; wctx.font = 'bold 14px sans-serif'; wctx.textAlign = 'center'; wctx.fillText(labels[i], 50, 5);
                wctx.restore();
            }
            wctx.restore();
        }

        let isSpinning = false;
        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true; spinBtn.disabled = true;
            let spinDuration = 3500; let startTimestamp = null;
            const targetRole = Math.random() < 0.5 ? '人' : '鬼';
            let baseRotations = 5 * Math.PI * 2; 
            let targetAngleOffset = (targetRole === '人') ? (Math.random() < 0.5 ? Math.PI*1.5 : Math.PI*0.5) : (Math.random() < 0.5 ? 0 : Math.PI);
            let finalRotation = baseRotations + (Math.PI * 2 - targetAngleOffset) - Math.PI/4;

            function animateSpin(timestamp) {
                if (!startTimestamp) startTimestamp = timestamp;
                let elapsed = timestamp - startTimestamp;
                let progress = Math.min(elapsed / spinDuration, 1);
                let easeOut = 1 - Math.pow(1 - progress, 3);
                let currentAngle = finalRotation * easeOut;
                drawWheel(currentAngle);
                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    playerRole = targetRole; isSpinning = false; spinBtn.disabled = false;
                    wheelOverlay.classList.add('hidden'); msgOverlay.classList.remove('hidden'); leaderboardBox.classList.add('hidden');
                    msgTitle.innerText = `🔮 命運已決：【${playerRole === '人' ? '人類' : '惡鬼'}】`;
                    msgDesc.innerText = playerRole === '人' ? "化身凡人求生 30 秒！" : "化身厲鬼大開殺戒，NPC人類已獲得極限360度避障盲區AI！";
                    msgNextBtn.innerText = "進入第一關";
                }
            }
            requestAnimationFrame(animateSpin);
        });

        msgNextBtn.addEventListener('click', () => {
            msgOverlay.classList.add('hidden');
            if (currentLevel === 1 && npcs.length === 0 && !gameActive) {
                startLevel();
            } else if (currentLevel > maxLevels) {
                clearInterval(gameTimer); gameActive = false; currentLevel = 1; totalScoreRaw = 0; totalDeaths = 0; playerRole = '未定';
                msgOverlay.classList.add('hidden'); nameOverlay.classList.remove('hidden');
                renderLeaderboard('leaderboard-init');
            } else {
                startLevel();
            }
        });

        function initJoystick() {
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            let maxRadius = 35; let startX = 0, startY = 0;
            zone.addEventListener('touchstart', (e) => {
                touchControls.active = true; const t = e.touches[0]; startX = t.clientX; startY = t.clientY;
            });
            zone.addEventListener('touchmove', (e) => {
                if (!touchControls.active) return;
                const t = e.touches[0]; let dx = t.clientX - startX; let dy = t.clientY - startY;
                let dist = Math.hypot(dx, dy);
                if (dist > maxRadius) { dx = (dx / dist) * maxRadius; dy = (dy / dist) * maxRadius; }
                stick.style.transform = `translate(${dx}px, ${dy}px)`;
                touchControls.vx = dx / maxRadius; touchControls.vy = dy / maxRadius;
            });
            const stopJoystick = () => {
                touchControls.active = false; touchControls.vx = 0; touchControls.vy = 0; stick.style.transform = `translate(0px, 0px)`;
            };
            zone.addEventListener('touchend', stopJoystick); zone.addEventListener('touchcancel', stopJoystick);
        }

        function checkObstacleCollision(x, y, radius) {
            let posX = x; let posY = y;
            obstacles.forEach(obs => {
                if (obs.type === 'rect') {
                    let closestX = Math.max(obs.x, Math.min(posX, obs.x + obs.width));
                    let closestY = Math.max(obs.y, Math.min(posY, obs.y + obs.height));
                    let distanceX = posX - closestX; let distanceY = posY - closestY;
                    let distance = Math.hypot(distanceX, distanceY);
                    if (distance < radius && distance > 0) {
                        let overlap = radius - distance; posX += (distanceX / distance) * overlap; posY += (distanceY / distance) * overlap;
                    } else if (distance === 0) { posX = obs.x - radius; }
                } else if (obs.type === 'circle') {
                    let distance = Math.hypot(posX - obs.x, posY - obs.y); let minDist = radius + obs.radius;
                    if (distance < minDist && distance > 0) {
                        let overlap = minDist - distance; posX += ((posX - obs.x) / distance) * overlap; posY += ((posY - obs.y) / distance) * overlap;
                    }
                }
            });
            return { x: posX, y: posY };
        }

        function findObstacleAvoidanceForce(npc, targetVx, targetVy) {
            const lookAheadLength = 22; const whiskerAngle = 0.4;
            const whickers = [
                { x: targetVx, y: targetVy, len: lookAheadLength },
                { x: targetVx * Math.cos(whiskerAngle) - targetVy * Math.sin(whiskerAngle), y: targetVx * Math.sin(whiskerAngle) + targetVy * Math.cos(whiskerAngle), len: lookAheadLength * 0.8 },
                { x: targetVx * Math.cos(-whiskerAngle) - targetVy * Math.sin(-whiskerAngle), y: targetVx * Math.sin(-whiskerAngle) + targetVy * Math.cos(-whiskerAngle), len: lookAheadLength * 0.8 }
            ];
            let steeringX = 0; let steeringY = 0; let mostThreatening = null; let minObstacleDist = Infinity;

            for (let w of whickers) {
                let checkX = npc.x + w.x * w.len; let checkY = npc.y + w.y * w.len;
                for (let obs of obstacles) {
                    let distToObs = Math.hypot(checkX - obs.cX, checkY - obs.cY);
                    let radiusSum = npc.radius + (obs.radius || Math.max(obs.width, obs.height) * 0.5);
                    if (distToObs < radiusSum + 4) {
                        let actualDist = Math.hypot(npc.x - obs.cX, npc.y - obs.cY);
                        if (actualDist < minObstacleDist) { minObstacleDist = actualDist; mostThreatening = obs; }
                    }
                }
            }
            if (mostThreatening) {
                let avoidDx = npc.x - mostThreatening.cX; let avoidDy = npc.y - mostThreatening.cY;
                let avoidDist = Math.hypot(avoidDx, avoidDy);
                if (avoidDist > 0) {
                    let normalX = avoidDx / avoidDist; let normalY = avoidDy / avoidDist;
                    let tangentX = -normalY; let tangentY = normalX;
                    if (tangentX * targetVx + tangentY * targetVy < 0) { tangentX = -tangentX; tangentY = -tangentY; }
                    let forceScale = (30 / (minObstacleDist + 1));
                    steeringX = (tangentX * 0.8 + normalX * 0.2) * forceScale; steeringY = (tangentY * 0.8 + normalY * 0.2) * forceScale;
                }
            }
            return { x: steeringX, y: steeringY };
        }

        function getSafeRandomPosition(radius, isGhost, tempHumans, tempGhosts) {
            let attempts = 0;
            while (attempts < 200) {
                let rx = Math.random() * (canvas.width - 40) + 20; let ry = Math.random() * (canvas.height - 40) + 20;
                if (!isGhost) {
                    if ((rx < 30 && ry < 30) || (rx > canvas.width - 30 && ry < 30) || (rx < 30 && ry > canvas.height - 30) || (rx > canvas.width - 30 && ry > canvas.height - 30)) { attempts++; continue; }
                }
                let res = checkObstacleCollision(rx, ry, radius); let tooClose = false;
                if (isGhost) {
                    for (let h of tempHumans) { if (Math.hypot(res.x - h.x, res.y - h.y) < 110) { tooClose = true; break; } }
                } else {
                    for (let g of tempGhosts) { if (Math.hypot(res.x - g.x, res.y - g.y) < 110) { tooClose = true; break; } }
                }
                if (!tooClose) return res;
                attempts++;
            }
            return checkObstacleCollision(Math.random() * (canvas.width - 50) + 25, Math.random() * (canvas.height - 50) + 25, radius);
        }

        function startLevel() {
            npcs = []; levelTimeElapsed = 0;
            let bornHumans = []; let bornGhosts = [];

            if (playerRole === '人') {
                timeLeft = 30;
                let res = getSafeRandomPosition(player.radius, false, [player], bornGhosts);
                player.x = res.x; player.y = res.y; bornHumans.push(player);
                timeVal.innerText = "⏳ 剩餘 " + timeLeft + "s";
            } else {
                timeLeft = 0;
                let res = getSafeRandomPosition(player.radius, true, bornHumans, [player]);
                player.x = res.x; player.y = res.y; bornGhosts.push(player);
                timeVal.innerText = "⏱️ 已歷時 " + levelTimeElapsed + "s";
            }

            if (playerRole === '人') {
                let ghostCount = (currentLevel >= 16) ? 2 : (1 + Math.floor(currentLevel * 0.35));
                let ghostSpeed = player.speed * (0.72 + ((currentLevel - 1) * (0.20 / 19)));
                for (let i = 0; i < ghostCount; i++) {
                    let res = getSafeRandomPosition(6, true, bornHumans, bornGhosts);
                    let ghostNpc = { x: res.x, y: res.y, radius: 6, speed: ghostSpeed, color: '#ff4757', aiType: 'hunter' };
                    npcs.push(ghostNpc); bornGhosts.push(ghostNpc);
                }
                roleVal.innerText = (currentLevel >= 16) ? '人類 (雙子極限生存)' : '人類 (生存逃亡)'; roleVal.style.color = '#2ed573';
            } else {
                let humanCount = (currentLevel >= 16) ? 2 : (3 + Math.floor(currentLevel * 0.3));
                let finalHumanSpeed = player.speed * (0.55 + ((currentLevel - 1) * (0.55 / 19)));
                for (let i = 0; i < humanCount; i++) {
                    let res = getSafeRandomPosition(5, false, bornHumans, bornGhosts);
                    let humanNpc = { x: res.x, y: res.y, radius: 5, baseSpeed: finalHumanSpeed, speed: finalHumanSpeed, color: '#2ed573', aiType: 'flee' };
                    npcs.push(humanNpc); bornHumans.push(humanNpc);
                }
                roleVal.innerText = (currentLevel >= 16) ? '惡鬼 (終結大狩獵)' : '惡鬼 (時間競速)'; roleVal.style.color = '#ff4757';
            }

            levelVal.innerText = currentLevel; respawnHint.innerText = "戰鬥中"; respawnHint.style.color = "#2ed573";

            clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                levelTimeElapsed++;
                if (playerRole === '人') {
                    timeLeft--; timeVal.innerText = "⏳ 剩餘 " + timeLeft + "s";
                    if (timeLeft <= 0) endLevel(false);
                } else {
                    timeVal.innerText = "⏱️ 已歷時 " + levelTimeElapsed + "s";
                    npcs.forEach(npc => {
                        if (npc.aiType === 'flee') {
                            npc.speed = Math.max(player.speed * 0.35, npc.baseSpeed * Math.pow(0.985, levelTimeElapsed));
                        }
                    });
                }
            }, 1000);

            gameActive = true; gameLoop();
        }

        function gameLoop() {
            if (!gameActive) return;
            updatePlayer(); updateNPCs(); checkCollisions(); draw();
            requestAnimationFrame(gameLoop);
        }

        function updatePlayer() {
            let nextX = player.x; let nextY = player.y;
            if (touchControls.active) {
                nextX += touchControls.vx * player.speed; nextY += touchControls.vy * player.speed;
            } else {
                if (keys['arrowup'] || keys['w']) nextY -= player.speed;
                if (keys['arrowdown'] || keys['s']) nextY += player.speed;
                if (keys['arrowleft'] || keys['a']) nextX -= player.speed;
                if (keys['arrowright'] || keys['d']) nextX += player.speed;
            }
            if (nextX - player.radius < 0) nextX = player.radius;
            if (nextX + player.radius > canvas.width) nextX = canvas.width - player.radius;
            if (nextY - player.radius < 0) nextY = player.radius;
            if (nextY + player.radius > canvas.height) nextY = canvas.height - player.radius;

            let res = checkObstacleCollision(nextX, nextY, player.radius);
            player.x = res.x; player.y = res.y;
        }

        function updateNPCs() {
            npcs.forEach(npc => {
                let dx = player.x - npc.x; let dy = player.y - npc.y;
                let distToPlayer = Math.hypot(dx, dy);
                let nextX = npc.x; let nextY = npc.y;

                if (npc.aiType === 'hunter') {
                    if (distToPlayer > 0) {
                        let targetVx = dx / distToPlayer; let targetVy = dy / distToPlayer;
                        let avoidForce = findObstacleAvoidanceForce(npc, targetVx, targetVy);
                        let finalVx = targetVx + avoidForce.x; let finalVy = targetVy + avoidForce.y;
                        let finalMag = Math.hypot(finalVx, finalVy);
                        nextX += (finalVx / finalMag) * npc.speed; nextY += (finalVy / finalMag) * npc.speed;
                    }
                } else if (npc.aiType === 'flee') {
                    const numDirections = 16;
                    let bestScore = -Infinity;
                    let bestDirX = 0; let bestDirY = 0;

                    if (distToPlayer > 0) {
                        let pDx = dx / distToPlayer; let pDy = dy / distToPlayer;

                        for (let i = 0; i < numDirections; i++) {
                            let angle = (i / numDirections) * Math.PI * 2;
                            let dirX = Math.cos(angle); let dirY = Math.sin(angle);

                            let escapeScore = (-dirX * pDx) + (-dirY * pDy); 
                            let totalScore = escapeScore * 120;

                            let testX = npc.x + dirX * npc.speed * 4;
                            let testY = npc.y + dirY * npc.speed * 4;

                            if (testX < 20 || testX > canvas.width - 20 || testY < 20 || testY > canvas.height - 20) {
                                totalScore -= 400;
                            }

                            obstacles.forEach(obs => {
                                let oDx = obs.cX - npc.x; let oDy = obs.cY - npc.y;
                                let obsDist = Math.hypot(oDx, oDy);

                                if (obsDist < 75) {
                                    let pToObsX = obs.cX - player.x; let pToObsY = obs.cY - player.y;
                                    let pToObsDist = Math.hypot(pToObsX, pToObsY);

                                    if (pToObsDist > 0) {
                                        let pToObsNx = pToObsX / pToObsDist; let pToObsNy = pToObsY / pToObsDist;
                                        let testToObsX = testX - obs.cX; let testToObsY = testY - obs.cY;
                                        let testToObsDist = Math.hypot(testToObsX, testToObsY);

                                        if (testToObsDist > 0) {
                                            let tToObsNx = testToObsX / testToObsDist; let tToObsNy = testToObsY / testToObsDist;
                                            let coverMatch = (pToObsNx * tToObsNx) + (pToObsNy * tToObsNy);
                                            if (coverMatch > 0.6) {
                                                totalScore += (coverMatch * 180) * (1.0 - (obsDist / 120));
                                            }
                                        }
                                    }

                                    if (obsDist < npc.radius + (obs.radius || Math.max(obs.width, obs.height) * 0.5) + 6) {
                                        let dotObstacle = (dirX * (oDx / obsDist)) + (dirY * (oDy / obsDist));
                                        if (dotObstacle > 0) totalScore -= 350;
                                    }
                                }
                            });

                            if (totalScore > bestScore) {
                                bestScore = totalScore; bestDirX = dirX; bestDirY = dirY;
                            }
                        }
                        nextX += bestDirX * npc.speed; nextY += bestDirY * npc.speed;
                    }
                }

                if (nextX - npc.radius < 0) nextX = npc.radius;
                if (nextX + npc.radius > canvas.width) nextX = canvas.width - npc.radius;
                if (nextY - npc.radius < 0) nextY = npc.radius;
                if (nextY + npc.radius > canvas.height) nextY = canvas.height - npc.radius;

                let finalPos = checkObstacleCollision(nextX, nextY, npc.radius);
                npc.x = finalPos.x; npc.y = finalPos.y;
            });
        }

        function checkCollisions() {
            for (let i = npcs.length - 1; i >= 0; i--) {
                let npc = npcs[i];
                if (Math.hypot(player.x - npc.x, player.y - npc.y) < player.radius + npc.radius) {
                    if (playerRole === '人') {
                        handlePlayerFailure(); return;
                    } else {
                        npcs.splice(i, 1);
                        if (npcs.length === 0) { endLevel(false); return; }
                    }
                }
            }
        }

        function handlePlayerFailure() {
            gameActive = false; clearInterval(gameTimer); totalDeaths++;
            saveToLeaderboard(playerName, currentLevel, Math.round(totalScoreRaw));
            msgOverlay.classList.remove('hidden'); leaderboardBox.classList.remove('hidden');
            renderLeaderboard('leaderboard-end');
            msgTitle.innerText = "💀 當關重來！你被惡鬼吞噬";
            msgDesc.innerHTML = `你在第 <strong>${currentLevel}</strong> 關陣亡。<br>挑戰紀錄已存入。`;
            msgNextBtn.innerText = "再度挑戰此關";
        }

        function endLevel(timeOutTriggered) {
            gameActive = false; clearInterval(gameTimer);
            let levelWeight = (playerRole === '人') ? 5.0 : Math.max(1.0, 5.0 - (levelTimeElapsed * 0.12));
            totalScoreRaw += levelWeight;

            if (currentLevel >= maxLevels) {
                saveToLeaderboard(playerName, currentLevel, Math.round(totalScoreRaw));
                msgOverlay.classList.remove('hidden'); leaderboardBox.classList.remove('hidden');
                renderLeaderboard('leaderboard-end');
                msgTitle.innerText = "🏆 完美謝幕！突破宿命戰役";
                msgDesc.innerHTML = `恭喜通關全 20 關！<br>最終獲得總積分：<strong style='color:#2ed573; font-size:1.3rem;'>${Math.round(totalScoreRaw)} 分</strong>`;
                msgNextBtn.innerText = "重啟全新全局面";
                currentLevel = 21; 
            } else {
                currentLevel++;
                msgOverlay.classList.remove('hidden'); leaderboardBox.classList.add('hidden');
                msgTitle.innerText = `🎉 第 ${currentLevel - 1} 關突破！`;
                msgDesc.innerText = `準備挑戰第 ${currentLevel} 關！`;
                msgNextBtn.innerText = "前進下一關";
            }
        }

        function saveToLeaderboard(name, level, score) {
            let list = JSON.parse(localStorage.getItem('hideSeekLeaderboard_v2')) || [];
            list.push({ name: name, level: level, score: score, date: Date.now() });
            list.sort((a,b) => b.score - a.score || b.level - a.level);
            list = list.slice(0, 5);
            localStorage.setItem('hideSeekLeaderboard_v2', JSON.stringify(list));
        }

        function renderLeaderboard(tableId) {
            const tbody = document.getElementById(tableId).querySelector('tbody');
            tbody.innerHTML = "";
            let list = JSON.parse(localStorage.getItem('hideSeekLeaderboard_v2')) || [];
            if(list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="color:#666;">暫無紀錄</td></tr>`; return;
            }
            list.forEach((item, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `<td>${index + 1}</td><td style="color:#1e90ff;">${item.name}</td><td>${item.level}</td><td style="color:#2ed573;font-weight:bold;">${item.score}</td>`;
                tbody.appendChild(tr);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 0.5;
            for(let i=0; i<canvas.width; i+=25) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
            ctx.fillStyle = '#ffffff';
            obstacles.forEach(obs => {
                if (obs.type === 'rect') { ctx.fillRect(obs.x, obs.y, obs.width, obs.height); } 
                else if (obs.type === 'circle') { ctx.beginPath(); ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2); ctx.fill(); ctx.closePath(); }
            });
            npcs.forEach(npc => {
                ctx.beginPath(); ctx.arc(npc.x, npc.y, npc.radius, 0, Math.PI * 2);
                ctx.fillStyle = npc.color; ctx.shadowBlur = 5; ctx.shadowColor = npc.color;
                ctx.fill(); ctx.closePath();
                if (npc.aiType === 'flee') {
                    ctx.strokeStyle = 'rgba(46, 213, 115, 0.12)'; ctx.strokeRect(npc.x - 15, npc.y - 15, 30, 30);
                }
            });
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color; ctx.shadowBlur = 10; ctx.shadowColor = player.color;
            ctx.fill(); ctx.closePath(); ctx.shadowBlur = 0;
        }
    </script>
